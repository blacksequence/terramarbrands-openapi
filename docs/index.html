<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Swagger UI - Terramar Brands API (wsTerramarV2)</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui/swagger-ui.css" />
    <link
      rel="icon"
      type="image/png"
      href="./swagger-ui/favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="./swagger-ui/favicon-16x16.png"
      sizes="16x16"
    />
    <script src="./swagger-ui/swagger-ui-bundle.js" crossorigin></script>
    <script
      src="./swagger-ui/swagger-ui-standalone-preset.js"
      crossorigin
    ></script>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script>
      window.ui = window.SwaggerUIBundle({
        url: "./openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        persistAuthorization: true,
        presets: [
          window.SwaggerUIBundle.presets.apis,
          window.SwaggerUIStandalonePreset,
        ],
        plugins: [window.SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout",
      });
    </script>
  </body>
</html>
